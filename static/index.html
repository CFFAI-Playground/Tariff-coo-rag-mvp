<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>關稅法規問答</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085;
    --border: #e3e6ec; --accent: #2457d6; --accent-soft: #e8eefc; --user: #2457d6; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e6e9ef; --muted: #98a2b3;
      --border: #2c323d; --accent: #7aa2ff; --accent-soft: #232d45; --user: #3a63d8; --error: #f97066;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.65 system-ui, "Microsoft JhengHei", "PingFang TC", sans-serif; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { margin: 0; font-size: 17px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  main { max-width: 860px; margin: 0 auto; padding: 16px 16px 140px; }
  .msg { margin: 14px 0; }
  .q { margin-left: auto; max-width: 85%; width: fit-content; background: var(--user); color: #fff;
       padding: 8px 14px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
  .a { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 16px; }
  .a .body { white-space: pre-wrap; word-wrap: break-word; }
  .a .err { color: var(--error); }
  .cite { color: var(--accent); font-weight: 600; cursor: pointer; }
  details.sources { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
  details.sources summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  .src { margin: 8px 0; padding: 8px 10px; background: var(--accent-soft); border-radius: 8px; font-size: 13px; }
  .src.hl { outline: 2px solid var(--accent); }
  .src b { display: block; }
  .src .loc { color: var(--muted); }
  .src pre { margin: 6px 0 0; white-space: pre-wrap; font: 12px/1.5 inherit; max-height: 180px; overflow: auto; }
  form { position: fixed; left: 0; right: 0; bottom: 0; background: var(--panel); border-top: 1px solid var(--border); padding: 12px 16px; }
  .row { max-width: 860px; margin: 0 auto; display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; height: 56px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border);
             background: var(--bg); color: var(--text); font: inherit; }
  button { padding: 0 18px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .steps { margin: 0 0 10px; padding: 8px 10px; border: 1px dashed var(--border); border-radius: 8px; font-size: 13px; }
  .step { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; color: var(--muted); }
  .step .ico { width: 1.2em; flex: none; text-align: center; }
  .step .name { flex: none; font-weight: 600; }
  .step .detail { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .step .ms { flex: none; font-variant-numeric: tabular-nums; }
  .step.running { color: var(--accent); }
  .step.running .ico { animation: blink 1s infinite; }
  .step.done { color: var(--text); }
  .step.failed { color: var(--error); }
  .steps .total { margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--border); color: var(--muted); text-align: right; }
  @keyframes blink { 50% { opacity: .3; } }
  .examples { color: var(--muted); font-size: 13px; }
  .examples a { color: var(--accent); cursor: pointer; display: block; margin: 4px 0; }
</style>
</head>
<body>
<header>
  <h1>關稅與原產地（COO）法規問答</h1>
  <p>依據「稅則稅率 進出口相關規範」資料夾內的文件回答；請以引用原文核對，回答不構成正式報關依據。</p>
</header>
<main id="chat">
  <div class="examples" id="examples">試試看：
    <a>鋁百葉的鋁葉片從中國進口、在越南組裝，COO 怎麼判定？</a>
    <a>蜂巢簾從台灣出口到美國，目前的總稅率是多少？</a>
    <a>Gift set 組合商品要怎麼決定稅則？</a>
  </div>
</main>
<form id="form">
  <div class="row">
    <textarea id="q" placeholder="輸入問題，Enter 送出，Shift+Enter 換行"></textarea>
    <button id="send">送出</button>
  </div>
</form>
<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('q');
const send = document.getElementById('send');

document.querySelectorAll('#examples a').forEach(a => a.onclick = () => { input.value = a.textContent.trim(); input.focus(); });
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

// render answer text, turning [n] into clickable citation links
function renderAnswer(container, text, srcBox) {
  container.textContent = '';
  for (const part of text.split(/(\[\d+\])/)) {
    const m = part.match(/^\[(\d+)\]$/);
    if (m) {
      const c = el('span', 'cite', part);
      c.onclick = () => {
        srcBox.open = true;
        const t = srcBox.querySelector(`[data-id="${m[1]}"]`);
        if (t) { srcBox.querySelectorAll('.hl').forEach(x => x.classList.remove('hl')); t.classList.add('hl'); t.scrollIntoView({block: 'center', behavior: 'smooth'}); }
      };
      container.append(c);
    } else container.append(part);
  }
}

// RAG pipeline panel: shows each stage as it runs, with timing (for demos / teaching)
function makeSteps() {
  const box = el('div', 'steps');
  const defs = [
    ['embed', '① 問題向量化', '把問題轉成向量（Gemini API）'],
    ['retrieve', '② 向量檢索', '和所有文件段落比對相似度'],
    ['generate', '③ Claude 生成', '根據檢索到的段落撰寫回答'],
  ];
  const rows = {};
  for (const [key, name, detail] of defs) {
    const r = el('div', 'step');
    r.append(el('span', 'ico', '○'), el('span', 'name', name), el('span', 'detail', detail), el('span', 'ms', ''));
    rows[key] = r; box.append(r);
  }
  const set = (key, state, detail, ms) => {
    const r = rows[key];
    r.className = 'step ' + state;
    r.querySelector('.ico').textContent = {running: '●', done: '✓', failed: '✕'}[state];
    if (detail != null) r.querySelector('.detail').textContent = detail;
    if (ms != null) r.querySelector('.ms').textContent = `${ms} ms`;
  };
  set('embed', 'running');
  return {
    box, set,
    fail() { for (const r of Object.values(rows)) if (r.classList.contains('running')) { r.className = 'step failed'; r.querySelector('.ico').textContent = '✕'; } },
    total(ms) { box.append(el('div', 'total', `總耗時 ${(ms / 1000).toFixed(1)} 秒`)); },
  };
}

form.addEventListener('submit', async e => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  document.getElementById('examples')?.remove();
  input.value = ''; send.disabled = true;

  chat.append(el('div', 'msg q', question));
  const box = el('div', 'msg a');
  const steps = makeSteps();
  const body = el('div', 'body');
  const srcBox = el('details', 'sources');
  box.append(steps.box, body, srcBox);
  chat.append(box);
  box.scrollIntoView({block: 'end'});

  let answer = '';
  try {
    const res = await fetch('/api/ask', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({question}) });
    if (!res.ok) throw new Error(`伺服器錯誤 ${res.status}`);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === 'step') {
          if (ev.step === 'embed') {
            steps.set('embed', 'done', `${ev.model} → ${ev.dims} 維向量 [${ev.preview.join(', ')}, …]`, ev.ms);
            steps.set('retrieve', 'running');
          } else if (ev.step === 'retrieve') {
            steps.set('retrieve', 'done', `從 ${ev.total} 段中取出最相關的 ${ev.k} 段（最高相似度 ${ev.top_score}）`, ev.ms);
            steps.set('generate', 'running', '等待 Claude 回應…');
          } else if (ev.step === 'first_token') {
            steps.set('generate', 'running', `${ev.model} 撰寫中（${ev.ms} ms 後出現第一個字）`);
          } else if (ev.step === 'generate') {
            steps.set('generate', 'done', null, ev.ms);
          }
        } else if (ev.type === 'done') {
          steps.total(ev.total_ms);
        } else if (ev.type === 'sources') {
          srcBox.append(el('summary', null, `參考資料（${ev.sources.length} 段）`));
          for (const s of ev.sources) {
            const d = el('div', 'src'); d.dataset.id = s.id;
            d.append(el('b', null, `[${s.id}] ${s.source}`), el('span', 'loc', `${s.location}　相似度 ${s.score}`), el('pre', null, s.text));
            srcBox.append(d);
          }
        } else if (ev.type === 'text') {
          answer += ev.text;
          renderAnswer(body, answer, srcBox);
        } else if (ev.type === 'error') {
          steps.fail(); body.append(el('div', 'err', ev.message));
        }
      }
    }
  } catch (err) {
    steps.fail(); body.append(el('div', 'err', '發生錯誤：' + err.message));
  } finally {
    send.disabled = false; input.focus();
  }
});
</script>
</body>
</html>
